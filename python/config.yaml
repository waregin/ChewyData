database:
  url: "postgresql+asyncpg://user:password@localhost:5432/chewydata"
  pool_size: 5

scraping:
  # Gentle by design — bot walls punish bursts. One page at a time, slow.
  concurrency: 1
  request_delay_min: 5.0        # seconds between requests (min)
  request_delay_max: 12.0       # seconds between requests (max, random jitter)
  retry_max_attempts: 4
  retry_backoff_base: 5.0
  # Optional: set to a proxy URL to route all requests through it, e.g. "http://user:pass@host:port"
  proxy_url: null

  # ── Anti-bot (Chewy uses Kasada) ──────────────────────────────────────
  # The scraper drives your real Chrome through Patchright, which hides the
  # automation signals Kasada looks for. No custom user agent or stealth
  # script: Patchright's defaults are what passed.
  # headless: false is strongly recommended — headless is the biggest tell.
  headless: false
  warmup_url: "https://www.chewy.com"   # visited first so Kasada issues its cookies
  warmup_pause: 4.0             # seconds of idle scrolling after warm-up
  challenge_timeout: 45.0       # max seconds to wait for Kasada's challenge to solve
  block_resources: false        # blocking images/fonts is untested against Kasada

  # Dedicated persistent Chrome profile (NOT your main profile, NOT Guest).
  # Keeps Kasada's KP_UIDz cookies between runs so you look like a returning
  # visitor. Same folder scripts/spike_patchright.py used, so it starts warm.
  # Created automatically; delete the folder to reset.
  profile_dir: ".chrome-profile-patchright"
  # "chrome" = your REAL installed Chrome (AUR: google-chrome). This is the
  # proven setup. null = Patchright's bundled Chromium (untested).
  browser_channel: chrome
  # Safety: stop after N products per run (small, infrequent runs = safest).
  # null = no cap. Start small (e.g. 25) until you trust it.
  max_products_per_run: 25
  # After a 429, cool down this many seconds before aborting the run.
  rate_limit_cooldown: 300.0

pet_profiles:
  - name: "cat"
    allergens:
      - alfalfa
      - kelp
      - rice
      - corn
      - peanut
      - spinach
      - flax
      - pumpkin
      - tomato
      - candida albicans
      - olive
      - mulberry
      - pecan
      - wheat
      - timothy
      - dandelion

  # Uncomment and populate when needed:
  # - name: "dog"
  #   allergens:
  #     - chicken
  #     - beef

